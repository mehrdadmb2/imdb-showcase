name: به‌روزرسانی و انتشار سایت

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: نصب Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: نصب وابستگی‌ها
        run: |
          cd src
          pip install -r requirements.txt
      
      - name: اجرای اسکریپت دریافت اطلاعات
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          cd src
          python fetch_imdb.py
      
      - name: آپلود فایل‌های docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
      
      - name: Commit و Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/movies.json
          git diff --staged --quiet || git commit -m "به‌روزرسانی خودکار فیلم‌ها [skip ci]"
          git push

  deploy:
    runs-on: ubuntu-latest
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: انتشار به GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
