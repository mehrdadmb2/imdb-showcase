<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد سینمایی من</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">داشبورد سینمایی</span>
            </div>
            <div class="header-stats" id="headerStats">
                <div class="stat-item">
                    <span class="stat-number" id="totalMovies">0</span>
                    <span class="stat-label">فیلم</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalHours">0</span>
                    <span class="stat-label">ساعت تماشا</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="avgRating">0</span>
                    <span class="stat-label">میانگین امتیاز</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="filterBtn" class="btn-filter">🔍 فیلتر</button>
                <button id="sortBtn" class="btn-sort">📊 مرتب‌سازی</button>
            </div>
        </div>
    </header>

    <main>
        <div class="filters-bar" id="filtersBar">
            <div class="filter-group">
                <label>حداقل امتیاز</label>
                <input type="range" id="minRating" min="0" max="10" step="0.5" value="0" />
                <span id="minRatingValue">0</span>
            </div>
            <div class="filter-group">
                <label>ژانر</label>
                <select id="genreFilter">
                    <option value="all">همه</option>
                </select>
            </div>
            <div class="filter-group">
                <label>سال</label>
                <select id="yearFilter">
                    <option value="all">همه</option>
                </select>
            </div>
            <button id="resetFilters" class="btn-reset">❌ پاک کردن فیلترها</button>
        </div>

        <div class="movies-grid" id="moviesGrid">
            <!-- فیلم‌ها به صورت داینامیک ساخته می‌شوند -->
        </div>

        <div class="loading" id="loading">⏳ در حال بارگذاری...</div>
    </main>

    <footer>
        <p>ساخته شده با ❤️ | داده‌ها از IMDb و OMDb API</p>
        <p id="lastUpdate">آخرین به‌روزرسانی: در حال دریافت...</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
