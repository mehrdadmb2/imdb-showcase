<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 داشبورد سینمایی من</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- پس‌زمینه متحرک با ستاره‌ها -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <header>
        <div class="header-container glass">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <span class="logo-text">سینمای من</span>
            </div>
            <div class="header-stats" id="headerStats">
                <div class="stat-item">
                    <span class="stat-number" id="totalMovies">0</span>
                    <span class="stat-label">فیلم</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalHours">0</span>
                    <span class="stat-label">ساعت</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="avgRating">0</span>
                    <span class="stat-label">میانگین</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalGenres">0</span>
                    <span class="stat-label">ژانر</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="filterBtn" class="btn-glass">🔍 فیلتر</button>
                <button id="sortBtn" class="btn-glass">📊 مرتب‌سازی</button>
            </div>
        </div>
    </header>

    <main>
        <!-- نوار فیلتر -->
        <div class="filters-bar glass" id="filtersBar">
            <div class="filter-group">
                <label>⭐ امتیاز</label>
                <input type="range" id="minRating" min="0" max="10" step="0.5" value="0" />
                <span id="minRatingValue">0</span>
            </div>
            <div class="filter-group">
                <label>🎭 ژانر</label>
                <select id="genreFilter">
                    <option value="all">همه</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📅 سال</label>
                <select id="yearFilter">
                    <option value="all">همه</option>
                </select>
            </div>
            <button id="resetFilters" class="btn-glass btn-reset">❌ پاک کردن</button>
        </div>

        <!-- شبکه فیلم‌ها -->
        <div class="movies-grid" id="moviesGrid">
            <!-- فیلم‌ها به صورت داینامیک ساخته می‌شوند -->
        </div>

        <div class="loading" id="loading">⏳ در حال بارگذاری...</div>
    </main>

    <!-- مودال -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content glass">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img class="modal-poster" id="modalPoster" src="" alt="Poster" />
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-meta">
                <span>📅 <strong id="modalYear"></strong></span>
                <span>⭐ کاربر: <strong id="modalUserRating"></strong></span>
                <span>⭐ IMDb: <strong id="modalImdbRating"></strong></span>
                <span>⏱️ <strong id="modalRuntime"></strong></span>
                <span>🔞 <strong id="modalRated"></strong></span>
            </div>
            <p class="modal-plot" id="modalPlot"></p>
            <div class="modal-details">
                <div class="detail-item"><span class="label">🎭 ژانر</span><span class="value" id="modalGenre"></span></div>
                <div class="detail-item"><span class="label">🎬 کارگردان</span><span class="value" id="modalDirector"></span></div>
                <div class="detail-item"><span class="label">👤 بازیگران</span><span class="value" id="modalActors"></span></div>
                <div class="detail-item"><span class="label">📝 نویسنده</span><span class="value" id="modalWriter"></span></div>
                <div class="detail-item"><span class="label">📅 انتشار</span><span class="value" id="modalReleased"></span></div>
                <div class="detail-item"><span class="label">🗳️ رای‌ها</span><span class="value" id="modalVotes"></span></div>
            </div>
        </div>
    </div>

    <footer class="glass">
        <p>ساخته شده با ❤️ | داده‌ها از <a href="https://www.imdb.com" target="_blank">IMDb</a> و <a href="http://www.omdbapi.com/" target="_blank">OMDb API</a></p>
        <p id="lastUpdate">آخرین به‌روزرسانی: در حال دریافت...</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
